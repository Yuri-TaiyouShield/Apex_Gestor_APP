# Local execution profile for development and UI validation.
# Use with: SPRING_PROFILES_ACTIVE=local

spring.datasource.url=jdbc:h2:mem:apex_local;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

apex.security.require-auth=false
management.health.db.enabled=true

# Massa ficticia, idempotente e exclusiva do perfil local.
apex.seed.homologacao=${APEX_SEED_HOMOLOGACAO:true}
