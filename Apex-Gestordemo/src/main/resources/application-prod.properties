# Production profile. Use with: SPRING_PROFILES_ACTIVE=prod

apex.security.require-auth=true
# Em producao, remover origens locais de dev (http://localhost:*) e permitir apenas app nativo/mobile explicito + APEX_CORS_ALLOWED_ORIGINS.
apex.security.cors.allowed-origins=${APEX_CORS_ALLOWED_ORIGINS:https://localhost,app://localhost,ionic://localhost,capacitor://localhost}
spring.datasource.password=${DB_PASSWORD}
apex.jwt.secret=${APEX_JWT_SECRET}
apex.license.enforcement.enabled=true
apex.seed.homologacao=false

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
