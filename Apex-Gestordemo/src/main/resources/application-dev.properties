# Development profile with local MySQL 8.4 Server.
# Activate with: SPRING_PROFILES_ACTIVE=dev or -Dspring-boot.run.profiles=dev

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:apex_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:apex_dev_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool e JPA: validacao estrita com Flyway
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Seguranca: autenticacao obrigatoria
apex.security.require-auth=true
apex.jwt.secret=${APEX_JWT_SECRET:apex-local-dev-jwt-secret-minimum-32-chars-key-2026}
apex.jwt.issuer=${APEX_JWT_ISSUER:apex-gestor}
apex.jwt.audience=${APEX_JWT_AUDIENCE:apex-api}
apex.license.enforcement.enabled=${APEX_LICENSE_ENFORCEMENT_ENABLED:false}
apex.seed.homologacao=${APEX_SEED_HOMOLOGACAO:true}

# Mensageria: outbox transacional ativo, RabbitMQ opcional
apex.messaging.rabbit.enabled=${APEX_MESSAGING_RABBIT_ENABLED:false}
management.health.rabbit.enabled=${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
spring.rabbitmq.listener.simple.auto-startup=${SPRING_RABBITMQ_AUTO_STARTUP:false}

# Observabilidade local
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
