# SonarCloud Configuration for Apex Gestor Enterprise
sonar.projectKey=Yuri-TaiyouShield_Apex_Gestor_APP
sonar.organization=yuri-taiyoushield
sonar.projectName=Apex_Gestor_APP

# Source and Test directories
sonar.sources=Apex-Gestordemo/src/main,Apex_Gestor/src
sonar.tests=Apex-Gestordemo/src/test,Apex_Gestor/src
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*Tests.java

# Encodings
sonar.sourceEncoding=UTF-8

# Exclusions from overall analysis (third-party, scripts, native mobile wrappers, build output)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/target/**,\
  tools/**,\
  scripts/**,\
  Apex_Gestor/android/**,\
  Apex_Gestor/electron/**,\
  Apex_Gestor/scripts/**,\
  **/*.sql

# Exclusions specifically from Duplication Detection (CPD)
sonar.cpd.exclusions=\
  **/*Test.java,\
  **/*Tests.java,\
  **/*.spec.ts,\
  **/db/migration*/**,\
  **/models.ts,\
  **/dto/**,\
  Apex_Gestor/src/app/core/models.ts

# Rule-specific ignores
sonar.issue.ignore.multicriteria=csp1,ip1
# Ignore CSP unsafe-inline / wildcards in Angular index.html (required by Angular runtime style injection and dev proxy)
sonar.issue.ignore.multicriteria.csp1.ruleKey=Web:S7039
sonar.issue.ignore.multicriteria.csp1.resourceKey=**/index.html
# Ignore emulator loopback IP in api-config.service.ts
sonar.issue.ignore.multicriteria.ip1.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.ip1.resourceKey=**/api-config.service.ts
