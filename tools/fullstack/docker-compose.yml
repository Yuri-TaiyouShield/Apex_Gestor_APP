services:
  apex-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: apex_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-apex_dev_2026}
    ports:
      - "127.0.0.1:${DB_PORT:-2705}:3306"
    volumes:
      - apex_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  backend-api:
    image: eclipse-temurin:25-jre-jammy
    restart: unless-stopped
    command: ["sh", "-c", "exec java -jar /app/backend/*.jar"]
    volumes:
      - ../backend:/app/backend:ro
    environment:
      DB_URL: jdbc:mysql://apex-db:3306/apex_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
      DB_HOST: apex-db
      DB_PORT: "3306"
      DB_NAME: apex_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-apex_dev_2026}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      FLYWAY_ENABLED: "true"
      APEX_SECURITY_REQUIRE_AUTH: ${APEX_SECURITY_REQUIRE_AUTH:-false}
      APEX_SEED_HOMOLOGACAO: ${APEX_SEED_HOMOLOGACAO:-true}
      APEX_JWT_SECRET: ${APEX_JWT_SECRET:-apex-local-test-secret-change-before-production-2026}
      APEX_CORS_ALLOWED_ORIGINS: ${APEX_CORS_ALLOWED_ORIGINS:-http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*,app://localhost,ionic://localhost,capacitor://localhost}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      apex-db:
        condition: service_healthy

  web-staff:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../web-staff:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${WEB_STAFF_PORT:-4200}:80"
    depends_on:
      - backend-api

  web-client:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../web-client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${WEB_CLIENT_PORT:-4201}:80"
    depends_on:
      - backend-api

volumes:
  apex_mysql_data:
