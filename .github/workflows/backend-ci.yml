name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  backend:
    name: Audit and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run repository audit
        shell: pwsh
        run: ./tools/audit/apex-enterprise-audit.ps1 -SkipBuild -Strict

      - name: Test backend
        working-directory: Apex-Gestordemo
        run: ./mvnw -q test

      - name: Package backend
        working-directory: Apex-Gestordemo
        run: ./mvnw -q -DskipTests package
